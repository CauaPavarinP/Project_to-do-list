<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="../css/style.css">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=analytics" />

</head>
<body>
    <div class="container">
        <!--- Sidebar --->
        <aside class="sidebar">
            <header class="sidebar-header">
                <h3 class="ToDoList">ToDoList</h3>
            </header>
            <nav>
                <button class="buttons-sidebar">
                    <span class="info-buttons">
                        <i class="material-symbols-outlined"> analytics </i>
                        <span>Dashboard</span>
                    </span>
                </button>

                <button class="buttons-sidebar">
                    <span class="info-buttons">
                        <i class="material-symbols-outlined"> analytics </i>
                        <span>Nova Tarefa</span>
                    </span>
                </button>

                <button class="buttons-sidebar">
                    <span class="info-buttons">
                        <i class="material-symbols-outlined"> analytics </i>
                        <span>Gerenciar Tarefas</span>
                    </span>
                </button>

                <button class="buttons-sidebar">
                    <span class="info-buttons">
                        <i class="material-symbols-outlined"> analytics </i>
                        <span>Configurações</span>
                    </span>
                </button>
            </nav>
        </aside>

        <!--- Content --->
        <div class="content">
            <header class="content-header">
                <div class="user">
                    <div class="user-photo"></div>
                    <div class="user-name">User</div>                  
                </div>
            </header>

            <!--- Main Content --->
            <main>

                <div class="info-grid">
                    <div class="info-card">
                        <h4>Total</h4>
                        <span>14</span>
                    </div>

                    <div class="info-card">
                        <h4>Concluídas</h4>
                        <span>8</span>
                    </div>

                    <div class="info-card">
                        <h4>Pendentes</h4>
                        <span>6</span>
                    </div>
                </div>

                <div class="atividade-grid">
                    <div class="atividade-card">
                        <h3>Próximas Tarefas</h3>

                        <ul>
                            <li>Estudar CSS</li>
                            <li>Finalizar Dashboard</li>
                            <li>Criar tela nova tarefa</li>
                        </ul>
                    </div>

                    <div class="atividade-card">
                        <h3>Atividades Recente</h3>

                        <ul>
                            <li>Tarefa Criada</li>
                            <li>Tarefa Concluída</li>
                            <li>Tarefa Editada</li>
                            <li>Tarefa Excluída</li>
                        </ul>
                    </div>
                </div> 
            </main>
        </div>

        <!--- Footer --->
        <footer>
            
        </footer>
    </div>
</body>
</html>
