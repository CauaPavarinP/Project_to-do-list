<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaTarefa</title>
    <link rel="stylesheet" href="../css/style.css">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=analytics" />

</head>
<body>
    <div class="container">
        <!--- Sidebar --->
        <aside class="sidebar">
            <header class="sidebar-header">
                <h3 class="ToDoList">ToDoList</h3>
            </header>
            <nav>
                <button class="buttons-sidebar">
                    <span class="info-buttons">
                        <i class="material-symbols-outlined"> analytics </i>
                        <span>Dashboard</span>
                    </span>
                </button>

                <button class="buttons-sidebar">
                    <span class="info-buttons">
                        <i class="material-symbols-outlined"> analytics </i>
                        <span>Nova Tarefa</span>
                    </span>
                </button>

                <button class="buttons-sidebar">
                    <span class="info-buttons">
                        <i class="material-symbols-outlined"> analytics </i>
                        <span>Gerenciar Tarefas</span>
                    </span>
                </button>

                <button class="buttons-sidebar">
                    <span class="info-buttons">
                        <i class="material-symbols-outlined"> analytics </i>
                        <span>Configurações</span>
                    </span>
                </button>
            </nav>
        </aside>

        <!--- Content --->
        <div class="content">
            <header class="content-header">
                <div class="user">
                    <div class="user-photo"></div>
                    <div class="user-name">User</div>                  
                </div>
            </header>

            <!--- Main Content --->
            <main>
                <form action="NovaTarefa">

                    <div class="coluna1">
                        <div class="campo_newtask">
                            <label>Nome da Tarefa</label>
                            <input type="text" name="name">
                        </div>

                        <div class="campo_newtask">
                            <label>Descrição</label>
                            <input type="text" name="descricao">
                        </div>
                    </div>

                    <div class="coluna2">
                        <div class="campo_newtask">
                            <label>Data Limite</label>
                            <input type="date">
                        </div>

                        <div class="campo_newtask">
                            <label>Prioridade</label>
                            <div class="opcoes-prioridades">
                                <label>
                                    <input type="radio" name="prioridade" value="baixa">
                                    Baixa
                                </label>

                                <label>
                                    <input type="radio" name="prioridade" value="baixa">
                                    Média
                                </label>

                                <label>
                                    <input type="radio" name="prioridade" value="baixa">
                                    Alta
                                </label>
                            </div>
                        </div>

                        <div class="campo_newtask">
                            <label>Categoria</label>
                            
                            <select name="categoria" id="">
                                <option value="">Selecionar</option>
                                <option value="">Estudos</option>
                                <option value="">Casa</option>
                                <option value="">Compras</option>
                                <option value="">Finanças</option>
                                
                            </select>
                        </div>
                    </div>
                </form>
            </main>
        </div>

        <!--- Footer --->
        <footer>
            
        </footer>
    </div>
</body>
</html>
