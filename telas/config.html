<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuração</title>
    <link rel="stylesheet" href="../css/style.css">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=analytics" />

</head>
<body>
    <div class="container">
        <!--- Sidebar --->
        <aside class="sidebar">
            <header class="sidebar-header">
                <h3 class="ToDoList">ToDoList</h3>
            </header>
            <nav>
                <button class="buttons-sidebar">
                    <span class="info-buttons">
                        <i class="material-symbols-outlined"> analytics </i>
                        <span>Dashboard</span>
                    </span>
                </button>

                <button class="buttons-sidebar">
                    <span class="info-buttons">
                        <i class="material-symbols-outlined"> analytics </i>
                        <span>Nova Tarefa</span>
                    </span>
                </button>

                <button class="buttons-sidebar">
                    <span class="info-buttons">
                        <i class="material-symbols-outlined"> analytics </i>
                        <span>Gerenciar Tarefas</span>
                    </span>
                </button>

                <button class="buttons-sidebar">
                    <span class="info-buttons">
                        <i class="material-symbols-outlined"> analytics </i>
                        <span>Configurações</span>
                    </span>
                </button>
            </nav>
        </aside>

        <!--- Content --->
        <div class="content">
            <header class="content-header">
                <div class="user">
                    <div class="user-photo"></div>
                    <div class="user-name">User</div>                  
                </div>
            </header>

            <!--- Main Content --->
            <main>                 
                
                <div class="config">
                    <h1>Configuração</h1>

                    <div class="campos-config">
                        <label>Nome do Usuário</label>
                        <input type="text">
                    </div>

                    <div class="campos-config">
                        <label>Gmail do Usuário</label>
                        <input type="text">
                    </div>

                    <div class="tema-config">
                        <label>Tema</label>

                        <div class="config-tema">
                            <input type="radio" name="tema" value="claro">claro
                            <input type="radio" name="tema" value="claro">escuro
                        </div>
                    </div>

                    <div class="noti-config">
                        <label>Notificações</label>

                        <div class="config-notificacao">
                            <label>
                                <input type="checkbox" name="lembrete" value="lembrete">
                                Receber lembretes
                            </label>
                            <label>
                                <input type="checkbox" name="prazo" value="prazo">
                                Receber avisos de prazo
                            </label>
                        </div>
                    </div>

                    <button>Salvar</button>

                </div>
            </main>
        </div>

        <!--- Footer --->
        <footer>
            
        </footer>
    </div>
</body>
</html>
