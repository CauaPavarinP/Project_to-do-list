<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDoList</title>
    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=analytics" />

</head>
<body>
    <div class="container">
        <!--
            SIDEBAR
        -->
        <aside class="sidebar">
            <header class="sidebar-header">
                <h3 class="ToDoList">ToDoList</h3>
            </header>
            <nav>
                <button class="buttons-sidebar" id="btn-dashboard">
                    <span class="info-buttons">
                        <i class="material-symbols-outlined"> analytics </i>
                        <span>Dashboard</span>
                    </span>
                </button>

                <button class="buttons-sidebar" id="btn-novaTarefa">
                    <span class="info-buttons">
                        <i class="material-symbols-outlined"> analytics </i>
                        <span>Nova Tarefa</span>
                    </span>
                </button>

                <button class="buttons-sidebar" id="btn-gerenciarTarefas">
                    <span class="info-buttons">
                        <i class="material-symbols-outlined"> analytics </i>
                        <span>Gerenciar Tarefas</span>
                    </span>
                </button>

                <button class="buttons-sidebar" id="btn-configuracao">
                    <span class="info-buttons">
                        <i class="material-symbols-outlined"> analytics </i>
                        <span>Configuração</span>
                    </span>
                </button>
            </nav>
        </aside>

        <!--
            ÁREA DO USUÁRIO 
        -->
        <div class="content">
            <header class="content-header">
                <div class="user">
                    <div class="user-photo"></div>
                    <div class="user-name">User</div>                  
                </div>
            </header>

            <!--
                CONTEÚDO PRINCIPAL
            --> 
            <main id="conteudo-principal">

            </main>
        </div>


        <footer>
            
        </footer>
    </div>
    <!-- Type="module" - permite que o arquivo possa usar import e export -->
    <script type="module" src="js/script.js"></script>
</body>
</html>
